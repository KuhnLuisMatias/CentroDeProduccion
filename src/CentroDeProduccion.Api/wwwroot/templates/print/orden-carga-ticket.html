<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Orden de Carga</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, Helvetica, sans-serif; font-size: 10px; color: #111; width: 80mm; margin: 0 auto; padding: 6mm; }
        h1 { font-size: 14px; margin-bottom: 2px; }
        .subtitulo { color: #555; margin-bottom: 8px; }
        .datos { margin-bottom: 10px; }
        .datos p { margin-bottom: 1px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
        th, td { border: 1px solid #999; padding: 3px 4px; text-align: left; }
        th { background: #eee; }
        .num { text-align: right; }
        .chofer { margin-top: 20px; width: 60%; }
        .chofer .linea { border-top: 1px solid #111; margin-top: 16px; padding-top: 3px; }
        @media print { body { width: auto; } }
    </style>
    <script>window.print();</script>
</head>
<body>
    <h1>Centro de Producción</h1>
    <p class="subtitulo">Orden de Carga</p>

    <div class="datos">
        <p><strong>Bar:</strong> {{BarNombre}}</p>
        <p><strong>Dirección:</strong> {{BarDireccion}}</p>
        <p><strong>Teléfono:</strong> {{BarTelefono}}</p>
        <p><strong>Encargado:</strong> {{BarEncargado}}</p>
    </div>

    <table>
        <thead>
            <tr>
                <th>N°</th>
                <th>Producto</th>
                <th class="num">Cant.</th>
                <th>Lote</th>
                <th>Obs.</th>
            </tr>
        </thead>
        <tbody>
            {{LineasHtml}}
        </tbody>
    </table>

    <div class="chofer">
        <div>Chofer</div>
        <div class="linea">{{Chofer}}</div>
    </div>
</body>
</html>
