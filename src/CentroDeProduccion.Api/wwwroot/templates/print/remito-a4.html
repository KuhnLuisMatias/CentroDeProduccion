<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Remito {{NumeroRemito}}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #111; width: 210mm; min-height: 297mm; margin: 0 auto; padding: 20mm; }
        h1 { font-size: 22px; margin-bottom: 4px; }
        .subtitulo { color: #555; margin-bottom: 20px; }
        .datos { margin-bottom: 20px; }
        .datos p { margin-bottom: 2px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #999; padding: 6px 8px; text-align: left; }
        th { background: #eee; }
        .num { text-align: right; }
        .total { font-size: 15px; font-weight: bold; text-align: right; margin-bottom: 30px; }
        .firmas { display: flex; justify-content: space-between; gap: 40px; margin-top: 60px; }
        .firma { flex: 1; text-align: center; }
        .firma .linea { border-top: 1px solid #111; margin-top: 32px; padding-top: 6px; }
        @media print { body { width: auto; } }
    </style>
    <script>window.print();</script>
</head>
<body>
    <h1>Centro de Producción</h1>
    <p class="subtitulo">Remito de entrega</p>

    <div class="datos">
        <p><strong>N° Remito:</strong> {{NumeroRemito}}</p>
        <p><strong>Fecha:</strong> {{Fecha}}</p>
        <p><strong>Bar:</strong> {{BarNombre}}</p>
        <p><strong>Dirección:</strong> {{BarDireccion}}</p>
    </div>

    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio unitario</th>
                <th>Subtotal</th>
                <th>Obs.</th>
            </tr>
        </thead>
        <tbody>
            {{LineasHtml}}
        </tbody>
    </table>

    <p class="total">Total: {{Total}}</p>

    <div class="firmas">
        <div class="firma">
            <div>Entregado por: {{EntregadoPor}}</div>
            <div class="linea"></div>
        </div>
        <div class="firma">
            <div>Recibido por: {{RecibidoPor}}</div>
            <div class="linea"></div>
        </div>
    </div>
</body>
</html>
