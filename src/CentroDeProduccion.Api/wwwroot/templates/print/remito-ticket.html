<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Remito {{NumeroRemito}}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, Helvetica, sans-serif; font-size: 10px; color: #111; width: 80mm; margin: 0 auto; padding: 6mm; }
        h1 { font-size: 14px; margin-bottom: 2px; }
        .subtitulo { color: #555; margin-bottom: 8px; }
        .datos { margin-bottom: 10px; }
        .datos p { margin-bottom: 1px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
        th, td { border: 1px solid #999; padding: 3px 4px; text-align: left; }
        th { background: #eee; }
        .num { text-align: right; }
        .total { font-size: 12px; font-weight: bold; text-align: right; margin-bottom: 14px; }
        .firmas { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
        .firma { flex: 1; text-align: center; }
        .firma .linea { border-top: 1px solid #111; margin-top: 18px; padding-top: 3px; }
        @media print { body { width: auto; } }
    </style>
    <script>window.print();</script>
</head>
<body>
    <h1>Centro de Producción</h1>
    <p class="subtitulo">Remito</p>

    <div class="datos">
        <p><strong>N°:</strong> {{NumeroRemito}}</p>
        <p><strong>Fecha:</strong> {{Fecha}}</p>
        <p><strong>Bar:</strong> {{BarNombre}}</p>
        <p><strong>Dirección:</strong> {{BarDireccion}}</p>
    </div>

    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th class="num">Cant.</th>
                <th class="num">Subtotal</th>
                <th>Obs.</th>
            </tr>
        </thead>
        <tbody>
            {{LineasHtml}}
        </tbody>
    </table>

    <p class="total">Total: {{Total}}</p>

    <div class="firmas">
        <div class="firma">
            <div>Entregado por</div>
            <div class="linea">{{EntregadoPor}}</div>
        </div>
        <div class="firma">
            <div>Recibido por</div>
            <div class="linea">{{RecibidoPor}}</div>
        </div>
    </div>
</body>
</html>
